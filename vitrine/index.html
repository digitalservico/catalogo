<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vittoriana Atacado - Vitrine</title>
    <!-- Importação de fonte com serifa elegante (Playfair Display) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vitrine.css">
</head>
<body>

    <!-- Faixa Dourada Superior estilo Omega Dornier -->
    <div class="faixa-topo-omega">
        <span>5% NA PRIMEIRA COMPRA COM O CUPOM: VITTORIANA5</span>
        <span class="separador">•</span>
        <span>NOVIDADES EXCLUSIVAS ATACADO</span>
        <span class="separador">•</span>
        <span>ENVIO SEGURO PARA TODO O BRASIL</span>
    </div>

    <!-- Cabeçalho Principal Luxuoso com Botão de Acesso -->
    <header class="vitrine-header">
        <div class="header-conteudo">
            <div class="logo-container">
                <h1 class="marca-titulo" id="vitrine-titulo-loja">Vittoriana</h1>
                <span class="marca-subtitulo">ATACADO</span>
            </div>
            <a href="login/login.html" class="btn-login-header">🔑 Entrar / Login</a>
        </div>
        <p class="marca-descricao">Coleção Exclusiva • Catálogo Oficial</p>
    </header>

    <!-- BARRA DE BUSCA E FILTROS COMPACTOS DA VITRINE -->
    <section class="container-busca-filtros">
        <!-- Campo de Pesquisa em Tempo Real -->
        <div class="caixa-busca-wrapper">
            <input type="text" id="campo-busca-vitrine" placeholder="O que você está procurando? (Ex: Vestido, Blusa, seda...)" oninput="aplicarFiltrosEBusca()">
            <span class="icone-busca">&#128081;</span>
        </div>

        <!-- Carrossel de Filtros estilo Pílulas com Rolagem Horizontal Suave -->
        <div class="carrossel-filtros-wrapper" id="container-pilulas-filtros">
            <!-- Pílulas dos filtros carregadas dinamicamente via JS -->
        </div>
    </section>

    <!-- Vitrine Principal -->
    <main class="vitrine-container" id="vitrine-produtos">
        <!-- Os produtos cadastrados aparecerão aqui -->
    </main>

    <script src="vitrine.js"></script>
</body>
</html>
