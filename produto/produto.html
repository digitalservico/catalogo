<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto</title>
    <!-- Fontes elegantes -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Importa o CSS da página do produto -->
    <link rel="stylesheet" href="produto.css">
    <!-- Importa o CSS da vitrine para que os cards inferiores fiquem idênticos -->
    <link rel="stylesheet" href="../vitrine/vitrine.css">
</head>
<body>

    <!-- Faixa Dourada Superior -->
    <div class="faixa-topo-omega">
        <span>5% NA PRIMEIRA COMPRA COM O CUPOM: VITTORIANA5</span>
        <span class="separador">•</span>
        <span>NOVIDADES EXCLUSIVAS ATACADO</span>
        <span class="separador">•</span>
        <span>ENVIO SEGURO PARA TODO O BRASIL</span>
    </div>

    <!-- Cabeçalho Elegante -->
    <header class="produto-header">
        <a href="../vitrine/vitrine.html" class="logo-link">
            <h1 class="marca-titulo" id="produto-titulo-loja">Vittoriana</h1>
            <span class="marca-subtitulo">ATACADO</span>
        </a>
    </header>

    <div class="container-produto">
        <!-- Navegação Breadcrumb / Voltar -->
        <nav class="breadcrumb-container">
            <a href="../vitrine/vitrine.html" class="btn-voltar">&#8592; Voltar para a Coleção</a>
        </nav>

        <!-- Card de Exposição do Produto Selecionado -->
        <main class="detalhe-wrapper" id="detalhe-produto">
            <!-- Inserido dinamicamente pelo JS -->
        </main>

        <!-- SEÇÃO DA VITRINE INTEGRADA (O cliente desliza e vê logo abaixo) -->
        <section class="secao-vitrine-relacionados">
            <div class="cabecalho-relacionados">
                <span class="subtitulo-relacionados">Coleção Exclusiva</span>
                <h2 class="titulo-relacionados">Outras Peças da Coleção</h2>
                <div class="divisor-luxo-centro"></div>
            </div>

            <!-- Grid da Vitrine carregada dinamicamente -->
            <div class="vitrine-container" id="vitrine-produtos-relacionados">
                <!-- Cards renderizados via JS -->
            </div>
        </section>
    </div>

    <script src="produto.js"></script>
</body>
</html>
